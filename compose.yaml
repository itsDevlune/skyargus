services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes: ["redis:/data"]
    restart: unless-stopped
  web:
    build: {context: ., dockerfile: deploy/Dockerfile}
    env_file: .env
    environment:
      DATABASE_URL: postgres://argus:${POSTGRES_PASSWORD}@db:5432/argus
      REDIS_URL: redis://redis:6379/0
      DATA_ROOT: /app/data
    volumes: ["artifacts:/app/data", "static:/app/staticfiles"]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: {context: ., dockerfile: deploy/Dockerfile}
    env_file: .env
    environment:
      DATABASE_URL: postgres://argus:${POSTGRES_PASSWORD}@db:5432/argus
      REDIS_URL: redis://redis:6379/0
      DATA_ROOT: /app/data
    volumes: ["artifacts:/app/data"]
    command: ["celery", "-A", "argus.celery:app", "worker", "--concurrency=1", "--loglevel=INFO"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    restart: unless-stopped
  reconciler:
    build: {context: ., dockerfile: deploy/Dockerfile}
    env_file: .env
    environment:
      DATABASE_URL: postgres://argus:${POSTGRES_PASSWORD}@db:5432/argus
      REDIS_URL: redis://redis:6379/0
    command: ["python", "manage.py", "workjobs", "--publish", "--recover"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    restart: unless-stopped
  nginx:
    image: nginx:stable-alpine
    ports: ["443:443"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro", "./deploy/certs:/etc/nginx/certs:ro", "static:/srv/static:ro"]
    depends_on: [web]
    restart: unless-stopped
volumes:
  postgres:
  redis:
  artifacts:
  static:
