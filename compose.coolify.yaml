# Coolify: Docker Compose build pack, normal managed mode (not Raw).
# Assign an HTTPS domain to proxy, internal port 80. Coolify generates secrets.
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  environment: &app-env
    ARGUS_DEBUG: "0"
    ARGUS_DISPATCH: database
    SECRET_KEY: ${SERVICE_PASSWORD_64_ARGUSSECRET:?Coolify must generate the application secret}
    DATABASE_URL: postgres://argus:${SERVICE_PASSWORD_64_ARGUSDB:?Coolify must generate the database password}@db:5432/argus
    DATA_ROOT: /app/state/artifacts
    ALLOWED_HOSTS: localhost,127.0.0.1,web,${SERVICE_FQDN_PROXY_80:?Configure the proxy domain}
    CSRF_TRUSTED_ORIGINS: ${SERVICE_URL_PROXY_80:?Configure an HTTPS proxy domain}
    PUBLIC_URL: ${SERVICE_URL_PROXY_80:?Configure an HTTPS proxy domain}
    ARGUS_SESSION_ACTIVE_JOBS: "0"
    ARGUS_SESSION_JOBS_PER_HOUR: "0"
    ARGUS_QUEUE_LIMIT: "0"
  volumes:
    - artifacts:/app/state
    - static-assets:/app/staticfiles

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_ARGUSDB:?Coolify must generate the database password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  init:
    <<: *app
    command: ["sh", "-c", "python deploy/check_coolify.py && python manage.py migrate --noinput && python manage.py collectstatic --noinput"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  web:
    <<: *app
    expose:
      - "8000"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s
    restart: unless-stopped
  worker:
    <<: *app
    command: ["python", "manage.py", "workjobs", "--recover"]
    depends_on:
      init:
        condition: service_completed_successfully
    stop_grace_period: 4m
    restart: unless-stopped
  proxy:
    image: nginx:stable-alpine
    environment:
      SERVICE_URL_PROXY_80: /
    expose:
      - "80"
    volumes:
      - ./deploy/nginx.coolify.conf:/etc/nginx/conf.d/default.conf:ro
      - static-assets:/srv/static:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health/"]
      interval: 20s
      timeout: 6s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  artifacts:
  static-assets:
