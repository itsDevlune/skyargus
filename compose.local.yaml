# Local HTTP installation. Existing compose.yaml remains the TLS deployment setup.
x-application: &application
  build:
    context: .
    dockerfile: Dockerfile
  environment: &environment
    ARGUS_DEBUG: "1"
    ARGUS_DISPATCH: database
    DATABASE_URL: sqlite:////app/state/local.sqlite3
    DATA_ROOT: /app/state/artifacts
    ALLOWED_HOSTS: localhost,127.0.0.1,web
    SECRET_KEY: ${ARGUS_SECRET_KEY:-local-docker-only-secret-not-for-public-deployment}
    ARGUS_SESSION_ACTIVE_JOBS: "0"
    ARGUS_SESSION_JOBS_PER_HOUR: "0"
    ARGUS_QUEUE_LIMIT: "0"
  volumes:
    - state:/app/state
    - static:/app/staticfiles

services:
  init:
    <<: *application
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput"]
    restart: "no"
  web:
    <<: *application
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
    restart: unless-stopped
  worker:
    <<: *application
    command: ["python", "manage.py", "workjobs", "--recover"]
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 4m
  proxy:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${ARGUS_PORT:-8000}:80"
    volumes:
      - ./deploy/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/srv/static:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  state:
  static:
