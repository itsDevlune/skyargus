# TLS terminates at Coolify; only its proxy should reach this internal service.
map $http_x_forwarded_proto $argus_forwarded_proto {
    default http;
    https https;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 64k;
    add_header Referrer-Policy same-origin always;

    location /static/ {
        alias /srv/static/;
        expires 1h;
    }
    location /health/ {
        proxy_pass http://web:8000;
        proxy_set_header Host web;
        proxy_set_header X-Forwarded-Proto $argus_forwarded_proto;
    }
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $argus_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 125s;
    }
}
