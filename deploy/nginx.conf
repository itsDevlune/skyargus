limit_req_zone $binary_remote_addr zone=api:10m rate=10r/m;
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    add_header Referrer-Policy same-origin always;
    location /static/ { alias /srv/static/; expires 7d; }
    location /api/v1/searches { limit_req zone=api burst=3 nodelay; proxy_pass http://web:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location / { proxy_pass http://web:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 45s; }
}
